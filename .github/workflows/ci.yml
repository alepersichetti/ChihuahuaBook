# Controlli a ogni push e a ogni pull request: lint, tipi, test unitari, build
# e test end-to-end con Playwright sul Supabase locale (in Docker sul runner).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipi, test unitari e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tipi
        run: npx next typegen && npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Test e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium per Playwright
        run: npx playwright install --with-deps chromium
      - name: Supabase locale, build dell'app e test
        run: npm run test:e2e
      - name: Rapporto di Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
